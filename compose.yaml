services:
  studio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9130:9130"
    environment:
      STUDIO_CONFIG: /app/config.json
    volumes:
      - ./deploy/docker-config.json:/app/config.json:ro
      - studio-state:/var/lib/haproxy-studio
      - /etc/haproxy:/etc/haproxy:ro
      - /var/lib/haproxy:/var/lib/haproxy:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  studio-state:
