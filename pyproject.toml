[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haproxy-studio"
version = "0.21.0"
description = "Self-hosted web administration for an existing HAProxy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
haproxy-studio = "haproxy_studio.web:main"

[tool.setuptools.package-data]
haproxy_studio = ["static/*"]

[tool.setuptools.packages.find]
include = ["haproxy_studio*"]
