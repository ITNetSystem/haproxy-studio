# Anonymized infrastructure topology; no production credentials or identifiers.
global
    log /dev/log	local0
    log /dev/log	local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private
    ssl-dh-param-file /etc/haproxy/dhparams.pem

    ssl-default-bind-options no-sslv3
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

        tune.ssl.default-dh-param 2048


        ssl-server-verify none
    tune.ssl.capture-buffer-size 800

defaults
    log	global
    mode	tcp
    option	httplog
    option	dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

listen listen_1
    mode http
    bind :9000
    stats enable
    stats uri            /haproxy?stats
    stats realm Synthetic\ Statistics
    stats refresh        30s
    stats uri /

frontend frontend_2
    bind *:80
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Strict-Transport-Security max-age=63072000

    mode http

    acl item_36  hdr(host) -i tenant1.example.test
    acl item_37 path -i /

    http-request redirect code 301 location https://tenant1.example.test/RDWeb/ if item_36 item_37
    http-request redirect scheme https unless { ssl_fc }

    acl item_38 hdr(host) -i tenant2.example.test tenant3.example.test
    acl item_39 hdr(host) -i tenant4.example.test tenant5.example.test
    acl item_40 hdr(host) -i tenant6.example.test tenant7.example.test
    acl item_41 hdr(host) -i tenant1.example.test
    acl item_42 hdr(host) -i tenant8.example.test
    acl item_43 hdr(host) -i tenant9.example.test
    use_backend backend_3 if item_43

backend backend_3
        mode http
        option forwardfor
        server item_44 192.0.2.1:80 check
        http-request redirect scheme https unless { ssl_fc }


frontend frontend_4
    bind *:443
    mode tcp
    log global
    option tcplog

    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }


    acl item_45         req_ssl_sni -i tenant1.example.test
    acl item_46 req_ssl_sni -i tenant2.example.test tenant3.example.test
    acl item_47    req_ssl_sni -i tenant4.example.test tenant5.example.test
    acl item_48  req_ssl_sni -i tenant6.example.test tenant7.example.test
    acl item_49 req_ssl_sni -i tenant8.example.test
    acl item_50   req_ssl_sni -i tenant10.example.test
    acl item_51    req.ssl_sni -i tenant11.example.test tenant12.example.test
    acl item_52  req.ssl_sni -i tenant13.example.test
    acl item_53	req.ssl_sni -i tenant14.example.test tenant15.example.test tenant16.example.test
    acl item_54	req.ssl_sni -i tenant17.example.test tenant18.example.test
    acl item_55	req.ssl_sni -i tenant19.example.test tenant20.example.test tenant21.example.test
    acl item_56	req.ssl_sni -i tenant22.example.test tenant23.example.test tenant24.example.test

    use_backend backend_16		if item_52
    use_backend backend_15		if item_51
    use_backend backend_17		if item_53 or item_54 or item_55 or item_56 or item_50

    use_backend backend_26          if item_45
    use_backend backend_27 if item_46
    use_backend backend_28    if item_47
    use_backend backend_29  if item_48
    use_backend backend_30           if item_49

    default_backend backend_27


frontend frontend_5
    bind 127.0.0.1:8443 ssl crt /etc/haproxy/certificates/certificate1.pem crt /etc/haproxy/certificates/certificate2.pem accept-proxy
    mode http
    option httplog

    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    acl item_57 hdr(host) -i tenant11.example.test tenant12.example.test
    use_backend backend_31 if item_57

    default_backend backend_31


frontend frontend_6
    bind 127.0.0.1:9443 ssl crt /etc/haproxy/certificates/certificate3.pem accept-proxy
    mode http
    option httplog

    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    acl item_58 hdr(host) -i tenant13.example.test
    use_backend backend_32 if item_58

    default_backend backend_32


frontend frontend_7
    bind 127.0.0.1:10443 ssl crt /etc/haproxy/certificates/certificate2.pem crt /etc/haproxy/certificates/certificate1.pem crt /etc/haproxy/certificates/certificate4.pem crt /etc/haproxy/certificates/certificate5.pem accept-proxy
    mode http
    option httplog
    capture request header Host len 100
    capture request header User-Agent len 200

    timeout client 60m

    acl item_59    hdr(host),lower,field(1,:) -i tenant17.example.test tenant18.example.test
    acl item_60        hdr(host),lower,field(1,:) -i tenant19.example.test tenant20.example.test tenant21.example.test
    acl item_61     hdr(host),lower,field(1,:) -i tenant10.example.test
    acl item_62        hdr(host),lower,field(1,:) -i tenant14.example.test tenant15.example.test tenant16.example.test
    acl item_63         hdr(host),lower,field(1,:) -i tenant22.example.test tenant23.example.test tenant24.example.test

    acl item_37 path -i /
    acl item_64 path_beg -i /Autodiscover
    acl item_65 path_beg -i /mapi
    acl item_66 path_beg -i /rpc
    acl item_67 path_beg -i /owa
    acl item_68 path_beg -i /Microsoft-Server-ActiveSync
    acl item_69 path_beg -i /ecp
    acl item_70 path_beg -i /ews
    acl item_71 path_beg -i /oab

    http-request return status 404 if item_61 item_37
    http-request redirect location https://tenant17.example.test/owa if item_59 item_37
    http-request redirect location https://tenant19.example.test/owa if item_60 item_37
    http-request redirect location https://tenant14.example.test/owa if item_62 item_37
    http-request redirect location https://tenant22.example.test/owa if item_63 item_37


    use_backend backend_18             if item_59 item_67 or item_60 item_67 or item_62 item_67 or item_63 item_67
    use_backend backend_19    if item_59 item_64 or item_60 item_64 or item_62 item_64 or item_63 item_64
    use_backend backend_20            if item_59 item_65 or item_60 item_65 or item_62 item_65
    use_backend backend_21      if item_59 item_68 or item_60 item_68 or item_62 item_68 or item_63 item_68
    use_backend backend_22             if item_59 item_70 or item_60 item_70 or item_62 item_70 or item_63 item_70
    use_backend backend_23             if item_59 item_66 or item_60 item_66 or item_62 item_66 or item_63 item_66
    use_backend backend_24             if item_59 item_69 or item_60 item_69 or item_62 item_69 or item_63 item_69
    use_backend backend_25             if item_59 item_71 or item_60 item_71 or item_62 item_71 or item_63 item_71
    http-request return status 404 if item_61 item_37
    use_backend backend_33       if item_61



frontend frontend_8
     bind *:465 ssl crt /etc/haproxy/certificates/certificate2.pem crt /etc/haproxy/certificates/certificate1.pem crt /etc/haproxy/certificates/certificate4.pem crt /etc/haproxy/certificates/certificate5.pem

     mode tcp
     timeout client 1m
     log global
     option tcplog
     tcp-request inspect-delay 5s
     tcp-request content capture req.ssl_sni len 50

     tcp-request content accept if { req.ssl_hello_type 1 }


    use_backend backend_10 if { ssl_fc_sni tenant17.example.test }
    use_backend backend_10 if { ssl_fc_sni tenant19.example.test }
    use_backend backend_10 if { ssl_fc_sni tenant14.example.test }
    use_backend backend_10 if { ssl_fc_sni tenant22.example.test }


frontend frontend_9
    bind *:587
    mode tcp
    timeout client 1m
    log global
    option tcplog


    use_backend backend_10 if { ssl_fc_sni tenant17.example.test }
    use_backend backend_10 if { ssl_fc_sni tenant19.example.test }
    use_backend backend_10 if { ssl_fc_sni tenant14.example.test }
    use_backend backend_10 if { ssl_fc_sni tenant22.example.test }

    default_backend backend_10

backend backend_10
    mode tcp
    option smtpchk EHLO haproxy-check
    balance roundrobin
    server item_72 192.0.2.2:587 check port 587
    server item_73 192.0.2.3:587 check port 587


frontend frontend_11
    bind *:993 ssl crt /etc/haproxy/certificates/certificate2.pem crt /etc/haproxy/certificates/certificate1.pem crt /etc/haproxy/certificates/certificate4.pem crt /etc/haproxy/certificates/certificate5.pem

    mode tcp
    log global
    option tcplog
    option logasap
    timeout client 35m

    acl item_74 ssl_fc_sni -i tenant17.example.test tenant19.example.test tenant14.example.test tenant22.example.test

    use_backend backend_12 if item_74
    default_backend backend_12


backend backend_12
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect ssl
    timeout server 35m

    server item_75 192.0.2.2:993 ssl verify none check
    server item_76 192.0.2.3:993 ssl verify none check



frontend frontend_13
    bind *:25
    mode tcp
    option tcplog

    tcp-request inspect-delay 5s
    tcp-request content accept if WAIT_END

    acl item_77 req.payload(0,512) -m sub -i tenant25.example.test tenant21.example.test tenant16.example.test tenant24.example.test

    use_backend backend_14 if item_77
    default_backend backend_14


backend backend_14
    mode tcp
    balance roundrobin
    option smtpchk EHLO haproxy-check

    server item_75 192.0.2.2:25 check
    server item_78 192.0.2.3:25 check



backend backend_15
    mode tcp
    server item_79 127.0.0.1:8443 send-proxy-v2

backend backend_16
    mode tcp
    server item_79 127.0.0.1:9443 send-proxy-v2

backend backend_17
    mode tcp
    server item_79 127.0.0.1:10443 send-proxy-v2



